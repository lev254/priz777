    .coin.silver {
      background: radial-gradient(circle at 35% 35%, #e0e0e0, #a0a0b0);
    }
    .coin::after {
      content: "✦";
      position: absolute;
      font-size: 12px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(0,0,0,0.25);
      font-weight: bold;

    @keyframes fallCoin {

      bonusInfo: `<p><span>✨</span> <strong>प्रोमो कोड क्या देता है:</strong></p><p>• बेहतर शुरुआती बोनस</p><p>• उपहार स्पिन</p><p>• बोनस पहले टॉप-अप पर किश्तों में</p><p style="margin-top:5px;"><span>💎</span> सक्रिय करें बेहतर शुरुआत</p>`,
      promoNote: '🎁 प्रोमो कोड पंजीकरण पर बोनस सक्रिय करता है',
      footerNote: '🔞 18+ | बोनस स्वचालित रूप से सक्रिय',
      copyAlert: '✅ LEVBONUS7 कोड कॉपी हो गया! "उपहार लें" क्लिक करें',
      copyBtn: '📋 कॉपी करें',
      claimBtn: '🎁 उपहार लें'
    },
    bn: {
      yearChip: '⚡ 2026 · সীমিত সংস্করণ ⚡',
      bonusInfo: `<p><span>✨</span> <strong>প্রোমো কোড কী দেয়:</strong></p><p>• উন্নত প্রারম্ভিক বোনাস</p><p>• উপহার স্পিন</p><p>• বোনাস প্রথম টপ-আপগুলিতে কিস্তিতে</p><p style="margin-top:5px;"><span>💎</span> সক্রিয় করুন উন্নত শুরু</p>`,
      promoNote: '🎁 প্রোমো কোড নিবন্ধনের সময় বোনাস সক্রিয় করে',
      footerNote: '🔞 18+ | বোনাস স্বয়ংক্রিয়ভাবে সক্রিয়',
      copyAlert: '✅ LEVBONUS7 কোড কপি করা হয়েছে! "উপহার নিন" ক্লিক করুন',
      copyBtn: '📋 কপি করুন',
      claimBtn: '🎁 উপহার নিন'
    },
    es: {
      yearChip: '⚡ 2026 · Edición Limitada ⚡',
      bonusInfo: `<p><span>✨</span> <strong>Lo que ofrece el código:</strong></p><p>• Bono inicial mejorado</p><p>• Giros de regalo</p><p>• Bono otorgado en partes para primeras recargas</p><p style="margin-top:5px;"><span>💎</span> Activa y obtén un comienzo mejorado</p>`,
      promoNote: '🎁 El código activa el bono al registrarse',
      footerNote: '🔞 18+ | Bono se activa automáticamente',
      copyAlert: '✅ ¡Código LEVBONUS7 copiado! Haz clic en "Reclamar Regalo"',
      copyBtn: '📋 Copiar',
      claimBtn: '🎁 Reclamar Regalo'
    }
  };

  let currentLang = 'en'; // по умолчанию английский
  function applyLanguage(lang) {
    currentLang = lang;
    const t = translations[lang];
    if (!t) return;
    document.getElementById('yearChip').innerHTML = t.yearChip;
    document.getElementById('bonusInfo').innerHTML = t.bonusInfo;
    document.getElementById('promoNote').innerHTML = t.promoNote;
    document.getElementById('footerNote').innerHTML = t.footerNote;
    document.getElementById('copyBtn').innerHTML = t.copyBtn;
    document.getElementById('claimBtn').innerHTML = t.claimBtn;
    window.currentCopyAlert = t.copyAlert;

    const flagMap = { en:'🇬🇧', ru:'🇷🇺', ar:'🇸🇦', tr:'🇹🇷', ur:'🇵🇰', fa:'🇮🇷', pt:'🇧🇷', id:'🇮🇩', ms:'🇲🇾', th:'🇹🇭', fil:'🇵🇭', hi:'🇮🇳', bn:'🇧🇩', es:'🇨🇱' };
    const nameMap = { en:'English', ru:'Русский', ar:'العربية', tr:'Türkçe', ur:'اردو', fa:'فارسی', pt:'Português', id:'Indonesia', ms:'Melayu', th:'ไทย', fil:'Filipino', hi:'हिन्दी', bn:'বাংলা', es:'Español' };
    if (flagMap[lang]) document.getElementById('currentFlag').innerText = flagMap[lang];
    if (nameMap[lang]) document.getElementById('currentLangName').innerText = nameMap[lang];
  }

  function copyPromo() {
    const promoText = document.getElementById('promoCode').innerText;
    navigator.clipboard.writeText(promoText).then(() => alert(window.currentCopyAlert)).catch(() => alert('Copy manually: ' + promoText));
  }
  document.getElementById('copyBtn').onclick = copyPromo;
  document.getElementById('claimBtn').onclick = () => window.open(CASINO_URL, '_blank');

  // Меню языков
  const langButton = document.getElementById('langButton');
  const langMenu = document.getElementById('langMenu');
  langButton.onclick = (e) => { e.stopPropagation(); langMenu.classList.toggle('show'); };
  document.querySelectorAll('.lang-item').forEach(item => {
    item.onclick = (e) => {
      e.stopPropagation();
      applyLanguage(item.getAttribute('data-lang'));
      langMenu.classList.remove('show');
    };
  });
  document.addEventListener('click', () => langMenu.classList.remove('show'));

  // Генерация монет (оптимизировано для телефона)
  let coinInterval;
  function startCoins() {
    if (coinInterval) clearInterval(coinInterval);
    coinInterval = setInterval(() => {
      const container = document.getElementById('coinsContainer');
      if (container.children.length < 20) {
        const coin = document.createElement('div');
        coin.classList.add('coin');
        if (Math.random() > 0.6) coin.classList.add('silver');
        const size = Math.random() * 22 + 18;
        coin.style.width = size + 'px';
        coin.style.height = size + 'px';
        coin.style.left = Math.random() * 100 + '%';
        const duration = Math.random() * 4 + 3;
        coin.style.animationDuration = duration + 's';
        coin.style.animationDelay = Math.random() * 2 + 's';
        container.appendChild(coin);
        setTimeout(() => coin.remove(), duration * 1000);
      }
    }, 350);
  }
  startCoins();
  applyLanguage('en'); // устанавливаем английский по умолчанию
</script>
