  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0708;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    /* Восточный орнамент на фоне */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(rgba(255, 215, 0, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ===== ПАДАЮЩИЕ МОНЕТЫ (ЗОЛОТЫЕ И СЕРЕБРЯНЫЕ) ===== */
    .coins-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .coin {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      box-shadow: 0 0 12px currentColor;
      animation: fallCoin linear infinite;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .coin.gold {
      background: radial-gradient(circle at 35% 35%, #FFE55C, #D4AF37, #B8860B);
      color: #ffd700;
    }
    .coin.silver {
      background: radial-gradient(circle at 35% 35%, #F0F0F0, #C0C0C0, #A0A0A0);
      color: #e0e0e0;
    }
    .coin::after {
      content: "◈";
      position: absolute;
      font-size: 20px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(0,0,0,0.25);
      font-weight: bold;
    }
    @keyframes fallCoin {
      0% {
        transform: translateY(-20vh) rotate(0deg) rotateX(0deg);
        opacity: 0;
      }
      15% { opacity: 0.9; }
      85% { opacity: 0.8; }
      100% {
        transform: translateY(120vh) rotate(1080deg) rotateX(540deg);
        opacity: 0;
      }
    }

    /* ===== ОСНОВНАЯ КАРТОЧКА — ВОСТОЧНЫЙ ШИК ===== */
    .glass-card {
      position: relative;
      z-index: 20;
      max-width: 640px;
      width: 100%;
      background: rgba(8, 6, 10, 0.65);
      backdrop-filter: blur(18px);
      border-radius: 80px 80px 72px 72px;
      border: 1px solid rgba(218, 165, 32, 0.6);
      box-shadow: 0 30px 45px rgba(0,0,0,0.5), 0 0 0 2px rgba(218,165,32,0.2) inset;
      transition: transform 0.3s ease, box-shadow 0.3s;
    }
    .glass-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 35px 55px rgba(218,165,32,0.2);
    }

    /* ===== КНОПКА ЯЗЫКА (ЯРКАЯ, БЕЛАЯ, С ФЛАГОМ) ===== */
    .language-dropdown {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 100;
    }
    .lang-button {
      background: #fff9f0;
      backdrop-filter: blur(4px);
      border: 2px solid #daa520;
      border-radius: 60px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 1rem;
      font-weight: 700;
      color: #2c1a0a;
      box-shadow: 0 5px 12px rgba(0,0,0,0.2);
    }
    .lang-button:hover {
      background: #c9e8ff;
      border-color: #0088cc;
      transform: scale(1.02);
    }
    .lang-flag-current {
      font-size: 1.6rem;
    }
    .lang-name-current {
      font-size: 0.9rem;
      font-weight: 700;
    }
    .lang-menu {
      position: absolute;
      top: 60px;
      right: 0;
      background: #fffef7;
      border-radius: 36px;
      padding: 10px 0;
      min-width: 230px;
      max-height: 420px;
      overflow-y: auto;
      border: 1px solid #daa520;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    .lang-menu.show {
      display: flex;
    }
    .lang-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 20px;

    .lang-item:hover {

    }

    }

  // Применить язык
  function applyLanguage(lang) {
    const t = translations[lang];
    if (!t) return;
    document.getElementById('bonusInfo').innerHTML = t.bonus;
    document.getElementById('promoNote').innerHTML = t.promoNote;
    document.getElementById('footerNote').innerHTML = t.footer;
    document.getElementById('copyBtn').innerHTML = t.copyBtn;
    document.getElementById('claimBtn').innerHTML = t.claimBtn;
    document.getElementById('yearChip').innerHTML = t.yearChip;
    window.currentCopyAlert = t.copyAlert;
    // Обновить флаг и название в кнопке
    const item = document.querySelector(`.lang-item[data-lang="${lang}"]`);
    if (item) {
      const flag = item.querySelector('.lang-flag').innerText;
      const name = item.querySelector('span:last-child').innerText;
      document.getElementById('currentFlag').innerText = flag;
      document.getElementById('currentLangName').innerText = name;
    }
  }

  // Копирование
  function copyPromo() {
    const promoText = document.getElementById('promoCode').innerText;
    navigator.clipboard.writeText(promoText).then(() => {
      alert(window.currentCopyAlert || 'Промокод скопирован!');
    }).catch(() => alert('Скопируйте вручную: ' + promoText));
  }
  document.getElementById('copyBtn').onclick = copyPromo;

  // Главная кнопка с реферальной ссылкой
  document.getElementById('claimBtn').onclick = () => {
    window.open(CASINO_URL, '_blank');
  };

  // Выпадающее меню языков
  const langBtn = document.getElementById('langButton');
  const langMenu = document.getElementById('langMenu');
  langBtn.onclick = (e) => {
    e.stopPropagation();
    langMenu.classList.toggle('show');
  };
  document.querySelectorAll('.lang-item').forEach(item => {
    item.onclick = (e) => {
      e.stopPropagation();
      const lang = item.getAttribute('data-lang');
      applyLanguage(lang);
      langMenu.classList.remove('show');
    };
  });
  document.addEventListener('click', () => langMenu.classList.remove('show'));

  // === МОНЕТЫ (золотые + серебряные) ===
  function createCoin() {
    const coin = document.createElement('div');
    const isGold = Math.random() > 0.3;
    coin.className = `coin ${isGold ? 'gold' : 'silver'}`;
    const size = Math.random() * 38 + 28;
    coin.style.width = size + 'px';
    coin.style.height = size + 'px';
    coin.style.left = Math.random() * 100 + '%';
    const duration = Math.random() * 6 + 4.5;
    coin.style.animationDuration = duration + 's';
    coin.style.animationDelay = Math.random() * 6 + 's';
    document.getElementById('coinsContainer').appendChild(coin);
    setTimeout(() => coin.remove(), duration * 1000);
  }
  setInterval(() => {
    if (document.getElementById('coinsContainer').children.length < 60) createCoin();
  }, 220);
  for (let i = 0; i < 35; i++) setTimeout(createCoin, i * 70);

  // Установка русского языка по умолчанию
  applyLanguage('ru');
</script>
